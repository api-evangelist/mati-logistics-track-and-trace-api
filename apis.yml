apis:
- name: Mati Logistics Track and Trace API
  description: 'REST/JSON API versioned under /v2 at https://api.matilogistics.com for tracking requests, shipments, containers,
    carrier and terminal reference data, and webhooks. Bearer-token auth (tnt_ keys, one per organization), cursor pagination,
    HMAC-SHA256-signed webhook deliveries with five event types, and 1,000 write / 10,000 read requests per hour per organization.


    NO MACHINE-READABLE CONTRACT IS PUBLISHED. Full STEP 0b contract discovery was run against every host on 2026-08-27 and
    every candidate missed: the service is FastAPI/uvicorn but /openapi.json, /docs and /redoc are switched off, and GET https://api.matilogistics.com/
    answers {"service":"tnt_api","docs":null}. There is no GraphQL, gRPC, WSDL, AsyncAPI, MCP server, agent card, llms.txt
    or /.well-known/ document of any kind, no SDK in any registry, and no public GitHub organization; the apis.json declared
    at submission (https://www.matilogistics.com/apis.json) returns 404. What DOES exist is an unusually complete, server-rendered,
    human-readable API Reference at https://www.matilogistics.com/api, from which the authentication, conventions, error,
    webhook, rate-limit, data-model and conformance artifacts in this repo were read verbatim. This is a live, well-documented
    API with no contract — a different finding from an undocumented one. Verified 2026-08-27.'
